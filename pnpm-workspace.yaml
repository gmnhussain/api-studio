packages:
  - "apps/*"
  - "packages/*"

# One version per dependency across the repo. Reference with "catalog:".
# Add an entry only when a package needs it, and say why in the commit body.
catalog:
  # TypeScript stays on 6.0.x: typescript-eslint (ADR-0007) supports TypeScript < 6.1.
  typescript: 6.0.3
  # ESLint stays on 9.x: eslint-config-next's plugins (react, import, jsx-a11y) do not support ESLint 10 yet.
  eslint: 9.39.5
  "@eslint/js": 9.39.5
  typescript-eslint: 8.71.0
  eslint-config-next: 16.3.8
  eslint-config-prettier: 10.1.8
  eslint-plugin-import-x: 4.17.1
  eslint-plugin-jsx-a11y: 6.10.2
  eslint-plugin-turbo: 2.11.7
  globals: 17.13.0
  prettier: 3.9.9
  prettier-plugin-tailwindcss: 0.8.1
  dependency-cruiser: 18.5.0
  "@commitlint/cli": 21.2.3
  "@commitlint/config-conventional": 21.2.3
  turbo: 2.11.7
  vitest: 5.0.3
  "@vitest/coverage-v8": 5.0.3
  # WCAG contrast maths for the design-token test.
  culori: 4.0.2
  "@types/culori": 4.0.1
  # Component tests (docs/development/testing.md).
  jsdom: 30.1.2
  "@testing-library/react": 16.3.3
  "@testing-library/dom": 10.4.2
  "@testing-library/user-event": 14.6.8
  "@testing-library/jest-dom": 7.0.1
  # IndexedDB for repository tests in Node.
  fake-indexeddb: 6.2.5
  # End-to-end tests in real browsers, with axe accessibility checks.
  "@playwright/test": 1.64.0
  "@axe-core/playwright": 4.13.0
  "@types/node": 24.19.1

  # Frontend
  next: 16.3.8
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  babel-plugin-react-compiler: 1.0.0
  tailwindcss: 4.3.3
  "@tailwindcss/postcss": 4.3.3
  # Client state (ADR-0004) and validation at trust boundaries.
  zustand: 5.0.15
  zod: 4.6.5
  # Sibling order that a move rewrites in one record (data-model.md#conventions).
  fractional-indexing: 4.0.0
  # Local-first persistence in IndexedDB (ADR-0002).
  dexie: 4.4.6
  # UI text catalog (ADR-0010).
  next-intl: 4.14.9

  # UI (shadcn/ui, base-nova style on Base UI primitives).
  # The CLI is a pinned dev dependency (`pnpm shadcn add …`): `pnpm dlx shadcn` fails under pnpm 11.
  shadcn: 4.21.4
  "@base-ui/react": 1.9.0
  class-variance-authority: 0.7.1
  cn: 0.4.0
  lucide-react: 1.55.0
  tw-animate-css: 1.4.0
  # Toasts (shadcn Sonner) and forms (conventions.md#state-forms-and-validation).
  sonner: 2.0.8
  react-hook-form: 7.90.0
  "@hookform/resolvers": 5.9.1
  # Layout and presence animations (design-system.md#motion).
  motion: 14.2.0
  # Fails the build when a server-only module (cookie readers) reaches the browser.
  server-only: 0.0.1
  # Resizable studio panels (shadcn Resizable).
  react-resizable-panels: 4.14.4

# Packages allowed to run install scripts (pnpm 11 blocks them by default).
# Prebuilt binaries cover all of these; esbuild's script only verifies its binary.
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  esbuild: true
  sharp: false
  unrs-resolver: false

overrides:
  # shadcn asks for zod ^3.24.1, but its @modelcontextprotocol/sdk needs zod >= 3.25 (for "zod/v3").
  "zod@<3.25.0": 3.25.76

minimumReleaseAgeExclude:
  - "@testing-library/user-event@14.6.8"
  - framer-motion@14.2.0
  - motion-dom@14.2.0
  - motion-utils@14.1.1
  - motion@14.2.0
