# CI gates from docs/development/testing.md#ci-gates-every-push-and-pull-request.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Typecheck, lint, format, tests, boundaries, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Turbo skips tasks whose inputs did not change since a cached run.
      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/core/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      # Gate 1
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      # Gate 2
      - name: Typecheck
        run: pnpm typecheck
      # Gate 3
      - name: ESLint
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check
      # Gate 4
      - name: Unit and integration tests
        run: pnpm test
      - name: Coverage thresholds (packages/core)
        run: pnpm --filter @api-studio/core test:coverage
      # Gate 5
      - name: Module boundaries (dependency-cruiser)
        run: pnpm depcruise
      # Gate 6
      - name: Build
        run: pnpm build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Gate 9: known vulnerabilities in production dependencies fail the build.
      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod

  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Gate 10: Conventional Commits, which the changelog is generated from.
      - name: commitlint
        run: >-
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Gate 7: Chromium on pull requests; Firefox and WebKit too on main and develop.
      PLAYWRIGHT_ALL_BROWSERS: ${{ github.event_name == 'push' && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps ${{ github.event_name == 'push' && 'chromium firefox webkit' || 'chromium' }}
      # Gates 7 and 8: journeys, accessibility (axe) and the performance budget.
      - name: Playwright
        run: pnpm test:e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
